<!DOCTYPE html>
‎<html lang="en">
‎<head>
‎  <meta charset="UTF-8" />
‎  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
<input type="file" id="fileInput" accept="image/*" />
‎<button id="generateBtn">Generate ICO (16,32,48,64)</button>
‎<button id="downloadBtn" style="display:none;">Download ICO</button>
‎
‎<div id="preview"></div>
‎
‎<script>
‎const input = document.getElementById("fileInput");
‎const generateBtn = document.getElementById("generateBtn");
‎const downloadBtn = document.getElementById("downloadBtn");
‎const preview = document.getElementById("preview");
function createPNGFromCanvas(canvas) {
  return new Promise((resolve) => {
    canvas.toBlob((blob) => {
      const reader = new FileReader();
      reader.onload = () => {
        resolve(new Uint8Array(reader.result));
      };
      reader.readAsArrayBuffer(blob);
    }, 'image/png');
  });
}

generateBtn.onclick = async () => {
  if (!input.files.length) {
    alert("Choose an image first");
    return;
  }

  const file = input.files[0];
  const img = new Image();
  img.src = URL.createObjectURL(file);

  img.onload = async () => {
    const sizes = [16, 32, 48, 64];
    const pngs = [];
    preview.innerHTML = "";

    for (const size of sizes) {
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");

      const ratio = Math.min(size / img.width, size / img.height);
      const w = img.width * ratio;
      const h = img.height * ratio;
      const x = (size - w) / 2;
      const y = (size - h) / 2;

      ctx.clearRect(0, 0, size, size);
      ctx.drawImage(img, x, y, w, h);

      // Preview image
      const dataURL = canvas.toDataURL("image/png");
      const imgPreview = document.createElement("img");
      imgPreview.src = dataURL;
      imgPreview.width = size;
      imgPreview.height = size;
      imgPreview.style = "margin: 5px; border: 1px solid #ccc; border-radius: 4px;";
      preview.appendChild(imgPreview);

      // Get PNG binary data
      const pngData = await createPNGFromCanvas(canvas);
      pngs.push({size, pngData});
    }

    const iconCount = pngs.length;
    const headerSize = 6 + 16 * iconCount;
    let imageOffset = headerSize;
    let totalSize = headerSize;

    pngs.forEach(({pngData}) => totalSize += pngData.length);

    const buffer = new ArrayBuffer(totalSize);
    const dv = new DataView(buffer);

    dv.setUint16(0, 0, true); // reserved
    dv.setUint16(2, 1, true); // type = icon
    dv.setUint16(4, iconCount, true); // number of images

    let offset = 6;

    pngs.forEach(({pngData, size}) => {
      dv.setUint8(offset++, size === 256 ? 0 : size); // width
      dv.setUint8(offset++, size === 256 ? 0 : size); // height
      dv.setUint8(offset++, 0); // color palette
      dv.setUint8(offset++, 0); // reserved
      dv.setUint16(offset, 1, true); // color planes
      offset += 2;
      dv.setUint16(offset, 32, true); // bits per pixel = 32 for PNG images
      offset += 2;
      dv.setUint32(offset, pngData.length, true); // size of png data
      offset += 4;
      dv.setUint32(offset, imageOffset, true); // offset of png data
      offset += 4;

      new Uint8Array(buffer, imageOffset, pngData.length).set(pngData);
      imageOffset += pngData.length;
    });

    const blob = new Blob([buffer], {type: "image/x-icon"});
    const url = URL.createObjectURL(blob);

    downloadBtn.style.display = "inline-block";
    downloadBtn.onclick = () => {
      const a = document.createElement("a");
      a.href = url;
      a.download = "favicon.ico";
      a.click();
    };
  };
};
</script>
</body>
</html>
