<!DOCTYPE html>
‎<html lang="en">
‎<head>
‎  <meta charset="UTF-8" />
‎  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
<input type="file" id="fileInput" accept="image/*" />
<button id="generateBtn">Generate ICO (16,32,48,64)</button>
<button id="downloadBtn" style="display:none;">Download ICO</button>

<div id="preview"></div>

<script>
const input = document.getElementById("fileInput");
const generateBtn = document.getElementById("generateBtn");
const downloadBtn = document.getElementById("downloadBtn");
const preview = document.getElementById("preview");

function createBMPFromCanvas(canvas) {
  const size = canvas.width;
  const ctx = canvas.getContext("2d");
  const imgData = ctx.getImageData(0, 0, size, size);
  const pixels = imgData.data;

  const rowSize = Math.ceil((24 * size + 31) / 32) * 4;
  const imageSize = rowSize * size;
  const fileSize = 54 + imageSize;

  const buffer = new ArrayBuffer(fileSize);
  const dv = new DataView(buffer);

  dv.setUint16(0, 0x4d42, true);
  dv.setUint32(2, fileSize, true);
  dv.setUint32(10, 54, true);
  dv.setUint32(14, 40, true);
  dv.setInt32(18, size, true);
  dv.setInt32(22, -size, true);
  dv.setUint16(26, 1, true);
  dv.setUint16(28, 24, true);
  dv.setUint32(34, imageSize, true);

  let offset = 54;
  let i = 0;
  for(let y = 0; y < size; y++) {
    for(let x = 0; x < size; x++) {
      dv.setUint8(offset++, pixels[i+2]);
      dv.setUint8(offset++, pixels[i+1]);
      dv.setUint8(offset++, pixels[i]);
      i += 4;
    }
    while((offset - 54) % rowSize) dv.setUint8(offset++, 0);
  }
  return new Uint8Array(buffer);
}

generateBtn.onclick = () => {
  console.log("Generate button clicked");
  if (!input.files.length) {
    alert("Choose an image first");
    return;
  }

  const file = input.files[0];
  const img = new Image();
  img.src = URL.createObjectURL(file);

  img.onload = () => {
    console.log("Image loaded");
    const sizes = [16, 32, 48, 64];
    const bmps = [];
    preview.innerHTML = "";

    sizes.forEach(size => {
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");

      const ratio = Math.min(size / img.width, size / img.height);
      const w = img.width * ratio;
      const h = img.height * ratio;
      const x = (size - w) / 2;
      const y = (size - h) / 2;

      ctx.clearRect(0, 0, size, size);
      ctx.drawImage(img, x, y, w, h);

      const dataURL = canvas.toDataURL("image/png");
      const imgPreview = document.createElement("img");
      imgPreview.src = dataURL;
      imgPreview.width = size;
      imgPreview.height = size;
      imgPreview.style = "margin: 5px; border: 1px solid #ccc; border-radius: 4px;";
      preview.appendChild(imgPreview);

      bmps.push({size, bmp: createBMPFromCanvas(canvas)});
    });

    const iconCount = bmps.length;
    const headerSize = 6 + 16 * iconCount;
    let imageOffset = headerSize;
    let totalSize = headerSize;

    bmps.forEach(({bmp}) => totalSize += bmp.length);

    const buffer = new ArrayBuffer(totalSize);
    const dv = new DataView(buffer);

    dv.setUint16(0, 0, true);
    dv.setUint16(2, 1, true);
    dv.setUint16(4, iconCount, true);

    let offset = 6;

    bmps.forEach(({bmp, size}) => {
      dv.setUint8(offset++, size === 256 ? 0 : size);
      dv.setUint8(offset++, size === 256 ? 0 : size);
      dv.setUint8(offset++, 0);
      dv.setUint8(offset++, 0);
      dv.setUint16(offset, 1, true);
      offset += 2;
      dv.setUint16(offset, 24, true);
      offset += 2;
      dv.setUint32(offset, bmp.length, true);
      offset += 4;
      dv.setUint32(offset, imageOffset, true);
      offset += 4;

      new Uint8Array(buffer, imageOffset, bmp.length).set(bmp);
      imageOffset += bmp.length;
    });

    const blob = new Blob([buffer], {type: "image/x-icon"});
    const url = URL.createObjectURL(blob);

    downloadBtn.style.display = "inline-block";
    downloadBtn.onclick = () => {
      const a = document.createElement("a");
      a.href = url;
      a.download = "favicon.ico";
      a.click();
    };
  };
};
</script>
</body>
</html>
