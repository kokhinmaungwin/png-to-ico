<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ICO Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>ICO Generator</h1>

    <input type="file" id="imageInput" accept="image/*">

    <div id="previewBox">
      <p>Preview</p>
      <img id="preview" />
    </div>

    <button id="genBtn">Generate ICO</button>

    <a id="downloadLink" style="display:none;">Download ICO</a>

  </div>

  <script src="app.js"></script>
</body>
</html>
