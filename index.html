<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ICO / Favicon Generator</title>
<style>
  body{font-family:Arial;padding:15px}
  #preview{border:1px solid #ccc;width:64px;height:64px;display:flex;align-items:center;justify-content:center}
  #preview img{max-width:100%;max-height:100%}
</style>
</head>
<body>

<h2>Favicon / ICO Generator</h2>

<input type="file" id="imgInput" accept="image/*"><br><br>

<button id="genBtn">Generate</button>

<h3>Output Preview</h3>
<div id="preview"></div>

<p id="sizeText"></p>

<button id="downloadBtn" style="display:none;">Download</button>

<canvas id="canvas" style="display:none;"></canvas>
<script src="normal.js"></script>
</body>
</html>
